[project]
name = "foldgemma"
authors = [{ name = "Tom Stanton", email = "tomdstanton@gmail.com" }]
description = "FoldGemma: Protein folding language models"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["bioinformatics", "genomics", "serotyping", "microbiology"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
inference = [
    "torch>=2.0.0",
    "safetensors",
    "huggingface-hub>=1.24.0",
    "orjson>=3.9.0",
]
train = [
    "foldgemma[inference]",
    "numpy",
]
all = [
    "foldgemma[train]",
]

[dependency-groups]
dev = ["foldgemma[all]"]

[project.urls]
Homepage = "https://github.com/tomdstanton/FoldGemma"
Repository = "https://github.com/tomdstanton/FoldGemma"
Documentation = "https://github.com/tomdstanton/FoldGemma"
"Bug Tracker" = "https://github.com/tomdstanton/FoldGemma/issues"
Changelog = "https://github.com/tomdstanton/FoldGemma/blob/master/CHANGELOG.md"

[project.scripts]
foldgemma = "foldgemma.cli:_entrypoint"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/foldgemma/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/foldgemma"]

[tool.ruff]
line-length = 120
exclude = [
    "*_version.py",".agents", ".git", ".venv", "__pycache__"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]
extend-select = ["ANN", "PYI"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.karva.profile.default.coverage]
branch = true